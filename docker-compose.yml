services:
  sharet:
    build: .
    container_name: sharet-app
    restart: always
    env_file:
      - .env.docker
    ports:
      - "5005:5005"
    volumes:
      # Persist PouchDB data across container restarts
      - sharet-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=5005
      - DATA_DIR=/app/backend/data
    # Resource limits (local-first optimization)
    # NOTE: 512m was too tight for Node + build + PouchDB under load and caused
    # OOM-kills that crash-looped the container ("whole app down, no reboot").
    # 1g gives headroom; the memswap cap is removed so a brief spike swaps
    # instead of being killed outright.
    mem_limit: 1g
    cpus: '1.5'
    labels:
      # Watched by the autoheal service below: if this container goes
      # "unhealthy" (healthcheck failing), autoheal force-restarts it.
      # Plain `restart: always` only restarts on EXIT, not on unhealthy.
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── autoheal: restarts any container labeled autoheal=true when it goes
  #    "unhealthy". This catches a hung/OOM'd app that restart:always alone
  #    would leave sitting in an unhealthy state instead of restarting.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: sharet-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=30
    volumes:
      # Lets autoheal talk to the Docker engine to restart sick containers.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sharet-data:
    driver: local
