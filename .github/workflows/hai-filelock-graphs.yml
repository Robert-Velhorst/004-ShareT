name: Qualify HAI stable runner dependency graphs
on:
  push:
    branches: [qualify/hai-filelock-graphs-20261029]
permissions:
  contents: read
jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: evidently
            python: "3.14"
          - runner: lm-eval
            python: "3.15"
          - runner: docling
            python: "3.15"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Robert-Velhorst/018-HAI
          ref: aa30aceeeaa53fa399b74673df1c92dc3afbd0ce
          path: hai
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          enable-cache: false
      - name: Resolve normal stable dependency graph
        env:
          RUNNER_NAME: ${{ matrix.runner }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          mkdir -p "$RUNNER_TEMP/hai-graph"
          cd "hai/services/${RUNNER_NAME}-runner"
          uv pip compile requirements.in --upgrade --generate-hashes --python-version "$PYTHON_VERSION" --python-platform x86_64-unknown-linux-gnu --prerelease disallow --output-file "$RUNNER_TEMP/hai-graph/requirements.lock" > "$RUNNER_TEMP/hai-graph/resolution.log" 2>&1
      - name: Retain metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hai-graph-${{ matrix.runner }}
          path: ${{ runner.temp }}/hai-graph/
          if-no-files-found: warn
          retention-days: 7
