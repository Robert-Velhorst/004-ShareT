name: Qualify Docling explicit CPU index graph
on:
  push:
    branches: [qualify/docling-explicit-cpu-index-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Robert-Velhorst/018-HAI
          ref: aa30aceeeaa53fa399b74673df1c92dc3afbd0ce
          path: hai
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          enable-cache: false
      - name: Resolve explicit CPU source graph
        run: python3 .github/qualification/docling-cpu-index.py
      - name: Retain metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docling-cpu-index-graph
          path: ${{ runner.temp }}/docling-index-graph/
          if-no-files-found: warn
          retention-days: 7
