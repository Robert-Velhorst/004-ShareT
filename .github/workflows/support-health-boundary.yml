name: Support health loopback boundary

on:
  push:
    branches: [fix/sharet-support-health-loopback-20261029]
  pull_request:
    paths:
      - scripts/support-bundle.cjs
      - scripts/support-health-boundary.test.cjs
      - .github/qualification/support-health-*
      - .github/workflows/support-health-boundary.yml

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - name: Bind every source payload before execution
        run: |
          python .github/qualification/support-health-source.py before
          git fetch --no-tags --depth=1 origin a5b2abc06f2716d6ddcd807ae85a3560f56b66cc
          git show a5b2abc06f2716d6ddcd807ae85a3560f56b66cc:scripts/support-bundle.cjs > "$RUNNER_TEMP/sharet-support-health/original-support-bundle.cjs"
      - name: Check syntax before boundary cases
        run: |
          node --check scripts/support-bundle.cjs
          node --check scripts/support-health-boundary.test.cjs
      - name: Compare real loopback controls and malformed inputs
        run: node scripts/support-health-boundary.test.cjs
      - name: Bind every source payload after execution
        if: always()
        run: python .github/qualification/support-health-source.py after
      - name: Preserve exact source and case evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sharet-support-health-boundary
          path: ${{ runner.temp }}/sharet-support-health/
          if-no-files-found: error
          retention-days: 14
