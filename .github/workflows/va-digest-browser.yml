name: Reproduce VA digest browser failure
on:
  push:
    branches: [qualify/va-digest-browser-20261029]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Robert-Velhorst/006-autoreminder-virtualworkers
          ref: 9fc9e5f1c6c849daab0dbf5d86e395ab69823b09
          path: va-dashboard
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.13.16
      - name: Install hash-bound YAML parser
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/qualification/va-yaml-requirements.txt
      - name: Check every package record before installation
        working-directory: va-dashboard
        run: python ../.github/qualification/va-pnpm-stability.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
      - name: Install exact candidate dependencies
        working-directory: va-dashboard
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: va-dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Run original digest recovery browser contracts
        working-directory: va-dashboard
        env:
          APTLSS_UI_ONLY: "true"
        run: pnpm exec playwright test --config e2e/digest-recovery-ui.config.ts
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest-recovery-diagnostics
          path: /tmp/va-digest-recovery-ui/results/
          if-no-files-found: warn
          retention-days: 7
