name: Crawlee stable Cheerio lock metadata
on:
  push:
    branches: [qualify/crawlee-cheerio-lock-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apify/crawlee
          ref: 96ed398b26954f0e7818cc862f33ff4bb706c84b
          path: crawlee
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - name: Select stable Corepack
        run: npm install --global corepack@0.36.0
      - name: Prepare publisher package manager
        run: corepack prepare yarn@4.10.3 --activate
      - name: Resolve lock metadata
        run: python3 .github/qualification/crawlee-lock-only-worker.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crawlee-lock-resolution
          path: ${{ runner.temp }}/crawlee-lock-resolution/
          if-no-files-found: warn
          retention-days: 7
