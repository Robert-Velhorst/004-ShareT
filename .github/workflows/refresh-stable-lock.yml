name: Prepare public stable lock metadata

on:
  pull_request:
    paths:
      - stable-dependency-refresh.json
      - scripts/prepare-stable-lock-metadata.cjs
      - tools/stable-lock/Dockerfile
      - .github/workflows/refresh-stable-lock.yml

permissions:
  contents: read

jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Copy only public package metadata
        env:
          SHARET_SCOPE: ${{ matrix.scope }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          scope=os.environ['SHARET_SCOPE']
          assert scope in {'frontend','backend'}
          repository=Path(os.environ['GITHUB_WORKSPACE'])
          package=repository if scope=='frontend' else repository/'backend'
          root=Path(os.environ['RUNNER_TEMP'])/('sharet-public-lock-'+scope)
          inputs=root/'inputs';inputs.mkdir(parents=True)
          (root/'outputs').mkdir()
          sources={'package.json':package/'package.json','package-lock.json':package/'package-lock.json',
                   'stable-dependency-refresh.json':repository/'stable-dependency-refresh.json',
                   'prepare-stable-lock-metadata.cjs':repository/'scripts/prepare-stable-lock-metadata.cjs'}
          hashes={}
          for name,path in sources.items():
              raw=path.read_bytes();hashes[name]=hashlib.sha256(raw).hexdigest()
              (inputs/name).write_bytes(raw)
          receipt={'scope':scope,'source_revision':os.environ['GITHUB_SHA'],'source_metadata_sha256':hashes}
          (inputs/'source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:handle.write('SHARET_METADATA_ROOT='+str(root)+'\n')
          PY
          sudo chown 1000:1000 "$RUNNER_TEMP/sharet-public-lock-${{ matrix.scope }}/outputs"
      - name: Build public metadata SDK
        run: docker build --file tools/stable-lock/Dockerfile --tag sharet-public-lock:ci tools/stable-lock
      - name: Resolve normal dependency graph without application execution
        run: |
          docker run --rm --read-only --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
            --mount type=bind,src="$SHARET_METADATA_ROOT/inputs",dst=/inputs,readonly \
            --mount type=bind,src="$SHARET_METADATA_ROOT/outputs",dst=/outputs \
            sharet-public-lock:ci '${{ matrix.scope }}'
      - name: Retain generated public metadata and all diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-lock-${{ matrix.scope }}
          path: ${{ runner.temp }}/sharet-public-lock-${{ matrix.scope }}
          if-no-files-found: error
