name: Qualify scikit-learn musl build requirements
on:
  push:
    branches: [qualify/scikit-musl-build-graph-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          enable-cache: false
      - name: Resolve candidate build graph without application install
        run: python3 .github/qualification/scikit-build-graph.py
      - name: Retain metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scikit-build-graph
          path: ${{ runner.temp }}/scikit-build-graph/
          if-no-files-found: warn
          retention-days: 7
