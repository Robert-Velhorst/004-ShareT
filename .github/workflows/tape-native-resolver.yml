name: Tape native resolver source port
on:
  push:
    branches: [qualify/sharet-tape-native-resolver-20261029]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tape-testing/tape
          ref: 223d58ebbde2c4a8505ea1ecd149408b87e8423a
          path: qualification-tape-sdk
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - name: Bind original SDK then verify native resolver and full current graph
        run: python .github/qualification/tape-native-resolver/qualify.py
      - name: Preserve exact source case and resolver evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tape-native-resolver-qualification
          path: ${{ runner.temp }}/tape-native-resolver/
          if-no-files-found: error
          retention-days: 14
