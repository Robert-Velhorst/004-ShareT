name: Qualify VA Dashboard calendar lock
on:
  push:
    branches: [qualify/va-day-picker-lock-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Robert-Velhorst/006-autoreminder-virtualworkers
          ref: b55233fb2a947291f0ca08d5952049c598b933ac
          path: va-dashboard
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
      - name: Resolve without installation
        run: python3 .github/qualification/va-day-picker-lock.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: va-day-picker-lock
          path: ${{ runner.temp }}/va-day-picker-lock/
          retention-days: 7
