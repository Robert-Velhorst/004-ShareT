name: Coveralls maintained HTTP client lock metadata
on:
  push:
    branches: [qualify/coveralls-http-lock-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nickmerwin/node-coveralls
          ref: 565da5f354758903445db6cbee3bdba9ec697b9e
          path: coveralls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - name: Select stable npm
        run: npm install --global npm@12.2.1
      - name: Resolve publisher lock metadata
        run: python3 .github/qualification/coveralls-lock-worker.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coveralls-lock-resolution
          path: ${{ runner.temp }}/coveralls-lock-resolution/
          if-no-files-found: warn
          retention-days: 7
