name: Qualify scikit-learn complete vendor tests
on:
  push:
    branches: [qualify/scikit-musl-vendor-tests-20261029]
permissions:
  contents: read
  actions: read
jobs:
  vendor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scikit-alpine-build
          path: ${{ runner.temp }}/scikit-built-artifact
          github-token: ${{ github.token }}
          run-id: 40967045288
      - name: Prepare verified source and build artifact
        run: |
          python3 .github/qualification/scikit-source-prepare.py
          mkdir "$RUNNER_TEMP/scikit-source-build/wheel-input"
          echo "914b6d16dcc16a976a405ba2108f0eeb938c2b02ea6f7789e6b535d02131cb04  $RUNNER_TEMP/scikit-built-artifact/wheel/scikit_learn-1.9.1+hai.1-cp315-cp315-linux_x86_64.whl" | sha256sum --check
          cp "$RUNNER_TEMP/scikit-built-artifact/wheel/"*.whl "$RUNNER_TEMP/scikit-source-build/wheel-input/"
      - name: Resolve complete stable test tool graph
        run: |
          cp .github/qualification/scikit-test-requirements.in "$RUNNER_TEMP/scikit-source-build/requirements-test.in"
          cd "$RUNNER_TEMP/scikit-source-build"
          uv pip compile requirements-test.in --upgrade --generate-hashes --python-version 3.15 --python-platform x86_64-unknown-linux-musl --prerelease disallow --output-file requirements-test.lock > requirements-resolution.log 2>&1
      - name: Run original complete vendor test command
        run: |
          cp .github/qualification/scikit-vendor-test.Dockerfile "$RUNNER_TEMP/scikit-source-build/Dockerfile"
          docker build --progress=plain "$RUNNER_TEMP/scikit-source-build" > "$RUNNER_TEMP/scikit-source-build/vendor-test.log" 2>&1
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scikit-vendor-test-evidence
          path: |
            ${{ runner.temp }}/scikit-source-build/source-identity.json
            ${{ runner.temp }}/scikit-source-build/requirements-test.in
            ${{ runner.temp }}/scikit-source-build/requirements-test.lock
            ${{ runner.temp }}/scikit-source-build/requirements-resolution.log
            ${{ runner.temp }}/scikit-source-build/vendor-test.log
          if-no-files-found: warn
          retention-days: 7
