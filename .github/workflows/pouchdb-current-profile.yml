name: PouchDB complete current profile resolution
on:
  push:
    branches: [qualify/sharet-pouchdb-current-profile-20261029]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/pouchdb
          ref: 194c0754bb482824c3cb07d6432c7b95707d0a72
          path: qualification-pouchdb-sdk
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - name: Resolve complete current profile without installing packages
        run: python .github/qualification/pouchdb-current-profile/resolve.py
      - name: Preserve source identities and normal resolver evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pouchdb-current-profile-resolution
          path: ${{ runner.temp }}/pouchdb-current-profile/
          if-no-files-found: error
          retention-days: 14
