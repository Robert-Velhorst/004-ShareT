name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pnpm-stability-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.13.16
      - name: Install hash-bound YAML parser
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r .github/qualification/yaml-policy-requirements.txt
      - name: Reject prerelease package records before installation
        run: python .github/qualification/strict-yaml-pnpm-guard.py

  installer:
    needs: pnpm-stability-policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm installer:win
      - uses: actions/upload-artifact@v7
        with:
          name: nationale-hulpgids-windows-installer
          path: release/*.exe
          if-no-files-found: error
